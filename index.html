      if (!str) return '';
      return String(str)

        .replace(/</g, '&lt;')

        .replace(/"/g, '&quot;');

        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (err) {
        ok = false;
      }
      document.body.removeChild(textarea);
      return ok;

        span.style.fontSize = `${26 + Math.floor(Math.random() * 14)}px`;
        span.style.animationDelay = `${delay}ms`;
        span.className = 'animate-float-up select-none drop-shadow-[0_4px_12px_rgba(244,63,94,0.6)]';
        layer.appendChild(span);
        setTimeout(() => span.remove(), 2400 + delay);
      }
    }

    function checkAndTriggerLevelUp(qIndex) {
      const qObj = QUESTIONS[qIndex];
      if (!qObj) return;
      if (qObj.level > state.celebratedLevel) {
        state.celebratedLevel = qObj.level;
        const lvlInfo = LEVELS[qObj.level - 1];
        const modal = document.getElementById('level-up-modal');
        if (modal && lvlInfo) {
          document.getElementById('level-up-icon').textContent = lvlInfo.icon;
          document.getElementById('level-up-title').textContent = `Level ${lvlInfo.level}: ${lvlInfo.title}`;
          document.getElementById('level-up-subtitle').textContent = lvlInfo.hype;
          modal.classList.remove('hidden');
          spawnFloatingEmojis(lvlInfo.icon, 7);
        }
      }
    }

    window.dismissLevelUp = function() {
      const modal = document.getElementById('level-up-modal');
      if (modal) modal.classList.add('hidden');
    };

    function generateRoomCode() {
      const presets = ['LOVE', 'KISS', 'FIRE', 'ROSE', 'SOUL', 'HEAT', 'LUST', 'SPARK', 'HEART', 'MINE'];
      const fourLetterPresets = presets.filter(w => w.length === 4);
      if (Math.random() < 0.45) {
        return fourLetterPresets[Math.floor(Math.random() * fourLetterPresets.length)];
      }
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // ==========================================
    // 5. FIREBASE ROOM ACTIONS (ONLINE MODE)
    // ==========================================
    function getRoomDocRef(code) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'sparks_rooms', code);
    }

    function subscribeToRoom(code) {
      if (unsubscribeRoom) {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }
      const roomRef = getRoomDocRef(code);
      unsubscribeRoom = onSnapshot(
        roomRef,
        (snapshot) => {
          if (!snapshot.exists()) {
            showToast("Room bondho hoye geche ba khuje pawa jayni.", "amber");
            state.screen = 'home';
            render();
            return;
          }
          const data = snapshot.data();
          const prevQIndex = state.roomData.currentQuestionIndex;
          state.roomData = {
            player1Name: data.player1Name || 'Player 1',
            player2Name: data.player2Name || '',
            currentQuestionIndex: typeof data.currentQuestionIndex === 'number' ? data.currentQuestionIndex : 0,
            answers: data.answers || {},
            reaction: data.reaction || null,
            completed: Boolean(data.completed)
          };

          // Handle incoming real-time reaction from partner
          if (state.roomData.reaction && state.roomData.reaction.id && state.roomData.reaction.id !== state.lastSeenReactionId) {
            state.lastSeenReactionId = state.roomData.reaction.id;
            if (state.roomData.reaction.senderRole !== state.playerRole) {
              spawnFloatingEmojis(state.roomData.reaction.emoji, 6);
              const senderName = state.roomData.reaction.senderRole === 'player1' ? state.roomData.player1Name : state.roomData.player2Name;
              showToast(`${senderName || 'Partner'} reacted ${state.roomData.reaction.emoji}`);
            }
          }

          // Auto-transition from lobby to game when partner joins
          if (state.screen === 'lobby' && state.roomData.player2Name) {
            state.screen = 'game';
            showToast(`${state.roomData.player2Name} joined! Let's play ❤️‍🔥`);
          }

          // Check if game finished
          if (state.roomData.completed || state.roomData.currentQuestionIndex >= QUESTIONS.length) {
            state.screen = 'summary';
          } else if (state.screen === 'game' && state.roomData.currentQuestionIndex !== prevQIndex) {
            checkAndTriggerLevelUp(state.roomData.currentQuestionIndex);
          }

          render();
        },
        (error) => {
          console.error("Room snapshot error:", error);
          showToast("Connection lost. Reconnecting...", "amber");
        }
      );
    }

    window.handleCreateRoom = async function() {
      const nameInput = document.getElementById('nickname-input');
      const nick = (nameInput ? nameInput.value.trim() : state.nickname.trim()) || 'Ami';
      state.nickname = nick;

      state.isLoading = true;
      render();

      const ok = await ensureAuth();
      if (!ok) {
        state.isLoading = false;
        render();
        showToast("Online server ready noy — Pass & Play try koro!", "amber");
        return;
      }

      try {
        let code = generateRoomCode();
        let roomRef = getRoomDocRef(code);
        let existing = await getDoc(roomRef);
        let attempts = 0;
        while (existing.exists() && attempts < 6) {
          code = generateRoomCode();
          roomRef = getRoomDocRef(code);
          existing = await getDoc(roomRef);
          attempts++;
        }

        const initialData = {
          roomCode: code,
          player1Name: nick,
          player1Uid: currentUser.uid,
          player2Name: '',
          player2Uid: '',
          currentQuestionIndex: 0,
          answers: {},
          reaction: null,
          completed: false,
          createdAt: Date.now()
        };

        await setDoc(roomRef, initialData);
        state.mode = 'online';
        state.roomCode = code;
        state.playerRole = 'player1';
        state.roomData = initialData;
        state.celebratedLevel = 1;
        state.isLoading = false;
        state.screen = 'lobby';
        subscribeToRoom(code);
        render();
      } catch (err) {
        console.error("Create room failed:", err);
        state.isLoading = false;
        render();
        showToast("Room create korte somossa hoyeche. Abar try koro!", "amber");
      }
    };

    window.handleJoinRoom = async function() {
      const nameInput = document.getElementById('nickname-input');
      const codeInput = document.getElementById('join-code-input');
      const nick = (nameInput ? nameInput.value.trim() : state.nickname.trim()) || 'Tumi';
      const code = (codeInput ? codeInput.value.trim() : state.joinCodeInput.trim()).toUpperCase().replace(/[^A-Z0-9]/g, '');

      state.nickname = nick;
      state.joinCodeInput = code;

      if (code.length !== 4) {
        showToast("4-letter Room Code ta likho!", "amber");
        return;
      }

      state.isLoading = true;
      render();

      const ok = await ensureAuth();
      if (!ok) {
        state.isLoading = false;
        render();
        showToast("Online server ready noy — Pass & Play try koro!", "amber");
        return;
      }

      try {
        const roomRef = getRoomDocRef(code);
        const snap = await getDoc(roomRef);
        if (!snap.exists()) {
          state.isLoading = false;
          render();
          showToast(`"${code}" room ta khuje pawa jayni! Code check koro.`, "amber");
          return;
        }

        const data = snap.data();
        // Determine role: if creator rejoins with same UID, keep player1, otherwise join as player2
        let role = 'player2';
        if (data.player1Uid === currentUser.uid && !data.player2Name) {
          role = 'player1';
        }

        if (role === 'player2') {
          await updateDoc(roomRef, {
            player2Name: nick,
            player2Uid: currentUser.uid
          });
        } else {
          await updateDoc(roomRef, {
            player1Name: nick
          });
        }

        state.mode = 'online';
        state.roomCode = code;
        state.playerRole = role;
        state.celebratedLevel = QUESTIONS[data.currentQuestionIndex || 0]?.level || 1;
        state.isLoading = false;
        state.screen = 'game';
        subscribeToRoom(code);
        render();
      } catch (err) {
        console.error("Join room failed:", err);
        state.isLoading = false;
        render();
        showToast("Room-e join kora jacche na. Abar try koro!", "amber");
      }
    };

      const qIdx = state.roomData.currentQuestionIndex;
      const qKey = `q${qIdx}`;
      const existingAns = state.roomData.answers?.[qKey] || {};

      // Prevent changing once both have locked in & revealed
      if (existingAns.player1 && existingAns.player2) return;

      try {

    window.advanceQuestionOnline = async function() {
      if (!currentUser || !db || !state.roomCode) return;
      const nextIdx = state.roomData.currentQuestionIndex + 1;
      const roomRef = getRoomDocRef(state.roomCode);
      try {
        if (nextIdx >= QUESTIONS.length) {
          await updateDoc(roomRef, { completed: true });

          await updateDoc(roomRef, { currentQuestionIndex: nextIdx });

      } catch (err) {
        console.error("Advance question error:", err);
        showToast("Next question-e jawa jacche na, abar try koro.", "amber");
      }
    };

      const levelInfo = LEVELS[question.level - 1];

      // Names & Answers
      const p1Name = isOnline ? state.roomData.player1Name : state.localP1Name;
      const p2Name = isOnline ? (state.roomData.player2Name || 'Partner') : state.localP2Name;
      const ansObj = isOnline ? (state.roomData.answers?.[qKey] || {}) : (state.localGame.answers?.[qKey] || {});
      const p1Choice = ansObj.player1 || null;
      const p2Choice = ansObj.player2 || null;

      // In Local Pass & Play mode, show Privacy Handoff Screen between Player 1 and Player 2
      if (!isOnline && state.localGame.turnStep === 'handoff') {
        return `
          <div class="flex-1 flex flex-col justify-between py-1 animate-pop-in">
            ${renderGameHeader(qIdx, levelInfo, progressPct, false)}

            <div class="glass-card rounded-3xl p-7 text-center my-auto border-amber-400/35">
              <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-rose-500/25 to-amber-500/25 border border-amber-400/30 flex items-center justify-center text-3xl mb-4">
                🙈
              </div>
              <span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 mb-3">
                ✅ ${escapeHtml(p1Name)} Locked In!
              </span>
              <h2 class="font-serif text-2xl font-bold text-white mb-2">
                Ebar Phone-ta ${escapeHtml(p2Name)}-ke Dao!
              </h2>
              <p class="text-sm text-rose-200/75 mb-7 leading-relaxed">
                ${escapeHtml(p1Name)}-er choice ekhon hidden ache. ${escapeHtml(p2Name)} nijer option select korle duijoner answer ekshathe reveal hobe!
              </p>
              <button onclick="confirmLocalHandoff()" class="w-full py-4 rounded-2xl btn-rose-gold font-bold text-white text-base">
                Ami ${escapeHtml(p2Name)}, Show Question 👀
              </button>
            </div>

            <div class="h-4"></div>
          </div>
        `;
      }

      // Determine reveal & current player perspective
      const bothAnswered = isOnline ? Boolean(p1Choice && p2Choice) : (state.localGame.turnStep === 'reveal');
      const isMatch = bothAnswered && p1Choice === p2Choice;

      // Active voter perspective
      const myRole = isOnline ? state.playerRole : (state.localGame.turnStep === 'p2_pick' ? 'player2' : 'player1');
      const myChoice = myRole === 'player1' ? p1Choice : p2Choice;
      const partnerChoice = myRole === 'player1' ? p2Choice : p1Choice;
      const myName = myRole === 'player1' ? p1Name : p2Name;
      const otherName = myRole === 'player1' ? p2Name : p1Name;

      return `
        <div class="flex-1 flex flex-col justify-between gap-3.5 animate-pop-in">
          <!-- Top Bar: Spice Level + Progress -->
          ${renderGameHeader(qIdx, levelInfo, progressPct, isOnline)}

          <!-- Live Partner Status Pills -->
          ${isOnline ? `
            <div class="grid grid-cols-2 gap-2">
              <div class="px-3 py-2 rounded-2xl glass-subtle flex items-center justify-between text-xs">
                <span class="font-semibold text-white truncate max-w-[95px]">${escapeHtml(myName)} (You)</span>
                ${myChoice
                  ? `<span class="text-emerald-300 font-bold">✅ Locked</span>`
                  : `<span class="text-rose-300/75 animate-pulse">Picking...</span>`
                }
              </div>
              <div class="px-3 py-2 rounded-2xl glass-subtle flex items-center justify-between text-xs">
                <span class="font-semibold text-amber-200 truncate max-w-[95px]">${escapeHtml(otherName)}</span>
                ${!state.roomData.player2Name
                  ? `<button onclick="handleCopyInviteLink()" class="text-amber-300 underline font-semibold">Invite 🔗</button>`
                  : partnerChoice
                    ? `<span class="text-emerald-300 font-bold">${bothAnswered ? '✅ Revealed' : '🔒 Ready!'}</span>`
                    : `<span class="text-amber-200/70 animate-pulse">⏳ Thinking...</span>`
                }
              </div>
            </div>
          ` : `
            <div class="px-3.5 py-2 rounded-2xl glass-subtle flex items-center justify-between text-xs">
              <span class="text-rose-200/80">Current Turn:</span>
              <span class="font-bold text-amber-300">
                ${bothAnswered ? '✨ Both Answered — Live Reveal!' : `👉 ${escapeHtml(myName)}'s Secret Pick`}
              </span>
            </div>
          `}

          <!-- Simultaneous Reveal Result Banner -->
          ${bothAnswered ? `
            <div class="p-3.5 rounded-2xl text-center border animate-pop-in ${
              isMatch
                ? 'bg-gradient-to-r from-rose-500/25 via-pink-500/20 to-amber-500/25 border-amber-400/50 shadow-[0_0_25px_rgba(245,158,11,0.2)]'
                : 'bg-rose-950/50 border-rose-400/35'
            }">
              <div class="text-base font-extrabold tracking-wide ${isMatch ? 'text-amber-300' : 'text-rose-200'}">
                ${isMatch ? 'Perfect Match! ❤️‍🔥' : 'Spicy Twist! 👀'}
              </div>
              <div class="text-xs text-rose-100/80 mt-0.5">
                ${isMatch
                  ? `Duijon-i Option ${p1Choice} choose korecho! Same vibe ✨`
                  : `${escapeHtml(p1Name)} chose <strong>${p1Choice}</strong> • ${escapeHtml(p2Name)} chose <strong>${p2Choice}</strong>`
                }
              </div>
            </div>
          ` : ''}

          <!-- Question Card -->
          <div class="glass-card rounded-3xl p-5 sm:p-6 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-rose-400">Question #${question.id}</span>
                <span class="text-[11px] font-medium text-rose-200/60">${escapeHtml(levelInfo.title)}</span>
              </div>
              <h2 class="font-serif text-xl sm:text-2xl font-bold text-white leading-snug mb-5">
                ${escapeHtml(question.q)}
              </h2>

              <!-- 3 Option Buttons -->
              <div class="space-y-3">
                ${['A', 'B', 'C'].map(optKey => {
                  const optText = question.options[optKey];
                  const isMyPick = myChoice === optKey;
                  const isP1Pick = p1Choice === optKey;
                  const isP2Pick = p2Choice === optKey;

                  let cardClasses = 'bg-white/[0.04] border-white/10 hover:border-rose-400/45';
                  let badgeClasses = 'bg-white/10 text-rose-200';

                  if (!bothAnswered) {
                    if (isMyPick) {
                      cardClasses = 'bg-rose-500/20 border-rose-500 shadow-[0_0_20px_rgba(244,63,94,0.28)]';
                      badgeClasses = 'bg-rose-500 text-white';
                    }
                  } else {
                    if (isP1Pick && isP2Pick) {
                      cardClasses = 'bg-gradient-to-r from-rose-500/25 to-amber-500/25 border-amber-400 shadow-[0_0_22px_rgba(245,158,11,0.28)]';
                      badgeClasses = 'bg-gradient-to-br from-rose-500 to-amber-500 text-white';
                    } else if (isP1Pick) {
                      cardClasses = 'bg-rose-500/20 border-rose-400';
                      badgeClasses = 'bg-rose-500 text-white';
                    } else if (isP2Pick) {
                      cardClasses = 'bg-amber-500/20 border-amber-400';
                      badgeClasses = 'bg-amber-500 text-slate-950';
                    } else {
                      cardClasses = 'bg-white/[0.02] border-white/5 opacity-55';
                    }
                  }

                  const clickFn = isOnline
                    ? `selectOptionOnline('${optKey}')`
                    : `selectOptionLocal('${optKey}')`;

                  return `
                    <button onclick="${clickFn}" ${bothAnswered ? 'disabled' : ''}
                      class="w-full text-left p-4 rounded-2xl border transition-all duration-200 active:scale-[0.98] flex flex-col gap-2 ${cardClasses}">
                      <div class="flex items-start gap-3">
                        <span class="w-8 h-8 rounded-xl shrink-0 flex items-center justify-center font-extrabold text-sm ${badgeClasses}">
                          ${optKey}
                        </span>
                        <span class="text-sm sm:text-[15px] font-medium text-white leading-snug pt-1">
                          ${escapeHtml(optText)}
                        </span>
                      </div>

                      ${bothAnswered && (isP1Pick || isP2Pick) ? `
                        <div class="flex flex-wrap gap-1.5 pl-11 pt-0.5">
                          ${isP1Pick ? `
                            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-500/30 text-rose-100 border border-rose-400/40">
                              💖 ${escapeHtml(p1Name)}
                            </span>
                          ` : ''}
                          ${isP2Pick ? `
                            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/30 text-amber-100 border border-amber-400/40">
                              🔥 ${escapeHtml(p2Name)}
                            </span>
                          ` : ''}
                        </div>
                      ` : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Waiting Hint or Next Question Button -->
            <div class="mt-5 pt-3 border-t border-white/10">
              ${bothAnswered ? `
                <button onclick="${isOnline ? 'advanceQuestionOnline()' : 'advanceQuestionLocal()'}"
                  class="w-full py-4 rounded-2xl btn-rose-gold font-bold text-white text-base tracking-wide flex items-center justify-center gap-2 animate-pop-in">
                  <span>${qIdx + 1 >= QUESTIONS.length ? 'See Final Compatibility Score ❤️‍🔥' : 'Next Question →'}</span>
                </button>
              ` : `
                <div class="text-center text-xs text-rose-200/60 py-2">
                  ${isOnline
                    ? (myChoice
                        ? `🔒 Tomar choice locked! ${escapeHtml(otherName)} select korlei live reveal hobe...`
                        : `👆 Ekta option tap koro (partner dekhte pabe na jotokkhon na o-o pick kore)`)
                    : `👆 ${escapeHtml(myName)}, tomar secret choice tap koro`
                  }
                </div>
              `}
            </div>
          </div>

          <!-- Live Reaction Bar -->
          <div class="glass-subtle rounded-2xl px-3 py-2.5 flex items-center justify-between">
            <span class="text-[11px] font-semibold text-rose-200/60 pl-1">Live Reaction:</span>
            <div class="flex items-center gap-1.5 sm:gap-2">
              ${['❤️', '🔥', '😳', '😘', '😈'].map(emoji => `
                <button onclick="sendReaction('${emoji}')"
                  class="w-10 h-10 rounded-xl bg-white/5 hover:bg-rose-500/25 active:scale-90 transition flex items-center justify-center text-xl">
                  ${emoji}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderGameHeader(qIdx, levelInfo, progressPct, isOnline) {
      return `
        <div class="space-y-2">
          <div class="flex items-center justify-between gap-2">
            <!-- Spice Level Badge -->
            <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-gradient-to-r from-rose-500/25 to-amber-500/20 border border-rose-400/35 text-xs font-bold text-rose-100">
              <span>${levelInfo.badge}</span>
            </div>

            <div class="flex items-center gap-2">
              ${isOnline ? `
                <button onclick="handleCopyInviteLink()" class="px-2.5 py-1.5 rounded-full glass-subtle text-[11px] font-bold text-amber-300 border-amber-400/25">
                  Room: ${escapeHtml(state.roomCode)} 📋
                </button>
              ` : ''}
              <span class="text-xs font-bold text-rose-200/90 bg-white/5 px-3 py-1.5 rounded-full">
                Question ${qIdx + 1} of ${QUESTIONS.length}
              </span>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="w-full h-2 rounded-full bg-white/10 overflow-hidden">
            <div class="h-full rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-amber-400 transition-all duration-500" style="width: ${progressPct}%"></div>
          </div>
        </div>
      `;
    }

    function renderSummaryScreen() {
      const isOnline = state.mode === 'online';
      const p1Name = isOnline ? state.roomData.player1Name : state.localP1Name;
      const p2Name = isOnline ? (state.roomData.player2Name || 'Partner') : state.localP2Name;
      const answers = isOnline ? (state.roomData.answers || {}) : (state.localGame.answers || {});

      let totalAnswered = 0;
      let totalMatches = 0;

      const levelStats = LEVELS.map(lvl => ({
        ...lvl,
        matched: 0,
        total: 5
      }));

      QUESTIONS.forEach((q, idx) => {
        const a = answers[`q${idx}`];
        if (a && a.player1 && a.player2) {
          totalAnswered++;
          if (a.player1 === a.player2) {
            totalMatches++;
            levelStats[q.level - 1].matched++;
          }
        }
      });

      const matchPct = totalAnswered > 0 ? Math.round((totalMatches / totalAnswered) * 100) : 0;

      let compatTitle = "Sweet & Curious Duo ✨";
      let compatDesc = "Tomader moddhe onek notun kichu discover korar baki ache—perfect excuse for a long date night!";
      if (matchPct >= 80) {
        compatTitle = "Unstoppable Soulmate Flames ❤️‍🔥";
        compatDesc = "Tomader chemistry ar desire ekdom same wavelength-e! Sparks flying everywhere 🔥";
      } else if (matchPct >= 60) {
        compatTitle = "Passionate & Spicy Lovers 🌶️";
        compatDesc = "Darun chemistry! Bhalo balance ache romance ar wildness-er moddhe.";
      } else if (matchPct >= 40) {
        compatTitle = "Flirty & Intriguing Opposites 😈";
        compatDesc = "Different choices mane aro beshi teasing ar surprise! Ekjon arekjonke notun kore chinbe.";
      }

      const filteredQuestions = QUESTIONS.map((q, idx) => {
        const a = answers[`q${idx}`] || {};
        const matched = Boolean(a.player1 && a.player2 && a.player1 === a.player2);
        return { ...q, idx, p1: a.player1 || '-', p2: a.player2 || '-', matched };
      }).filter(item => {
        if (state.summaryFilter === 'match') return item.matched;
        if (state.summaryFilter === 'twist') return !item.matched;
        return true;
      });

      return `
        <div class="flex-1 flex flex-col gap-4 pb-6 animate-pop-in">
          <!-- Header -->
          <div class="flex items-center justify-between">
            <button onclick="goHome()" class="px-3 py-2 rounded-xl glass-subtle text-xs font-semibold text-rose-200/80 hover:text-white">
              🏠 Home
            </button>
            <span class="text-xs font-bold uppercase tracking-widest text-amber-300">Final Report</span>
            <button onclick="${isOnline ? 'resetOnlineRoom()' : 'startLocalMode()'}" class="px-3 py-2 rounded-xl glass-subtle text-xs font-semibold text-rose-300 hover:text-white">
              ↻ Replay
            </button>
          </div>

          <!-- Hero Compatibility Card -->
          <div class="glass-card rounded-3xl p-6 text-center relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-rose-500/15 via-transparent to-amber-500/15 pointer-events-none"></div>
            <div class="text-xs font-bold uppercase tracking-widest text-rose-300 mb-2">
              ${escapeHtml(p1Name)} ❤️ ${escapeHtml(p2Name)}
            </div>

            <!-- Score Circle -->
            <div class="w-28 h-28 mx-auto rounded-full bg-gradient-to-tr from-rose-500 to-amber-400 p-1 shadow-[0_0_35px_rgba(244,63,94,0.4)] mb-3">
              <div class="w-full h-full rounded-full bg-[#140d1c] flex flex-col items-center justify-center">
                <span class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-300 to-amber-300">
                  ${matchPct}%
                </span>
                <span class="text-[10px] font-semibold uppercase tracking-wider text-rose-200/60">Match Score</span>
              </div>
            </div>

            <h2 class="font-serif text-2xl font-bold text-white mb-1.5">${compatTitle}</h2>
            <p class="text-xs text-rose-200/80 leading-relaxed max-w-xs mx-auto mb-4">${compatDesc}</p>

            <div class="inline-flex items-center gap-3 px-4 py-2 rounded-2xl bg-black/40 border border-white/10 text-xs">
              <span>❤️‍🔥 <strong>${totalMatches}</strong> Matches</span>
              <span class="text-white/20">|</span>
              <span>👀 <strong>${Math.max(0, totalAnswered - totalMatches)}</strong> Twists</span>
            </div>
          </div>

          <!-- Level-by-Level Breakdown -->
          <div class="glass-card rounded-3xl p-5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-rose-200/75 mb-3.5">Level-by-Level Compatibility</h3>
            <div class="space-y-3">
              ${levelStats.map(lvl => {
                const pct = Math.round((lvl.matched / lvl.total) * 100);
                return `
                  <div>
                    <div class="flex items-center justify-between text-xs mb-1">
                      <span class="font-semibold text-white">${lvl.icon} L${lvl.level}: ${escapeHtml(lvl.title.split('(')[0].trim())}</span>
                      <span class="font-bold text-amber-300">${lvl.matched}/5 (${pct}%)</span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-white/10 overflow-hidden">
                      <div class="h-full rounded-full bg-gradient-to-r from-rose-500 to-amber-400" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Full 40 Questions Review -->
          <div class="glass-card rounded-3xl p-5">
            <div class="flex items-center justify-between gap-2 mb-4">
              <h3 class="text-xs font-bold uppercase tracking-wider text-rose-200/75">All Answers Review</h3>
              <div class="flex gap-1 bg-black/40 p-1 rounded-xl">
                <button onclick="setSummaryFilter('all')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${state.summaryFilter === 'all' ? 'bg-rose-500 text-white' : 'text-rose-200/60'}">All</button>
                <button onclick="setSummaryFilter('match')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${state.summaryFilter === 'match' ? 'bg-amber-500 text-slate-950' : 'text-rose-200/60'}">Matches</button>
                <button onclick="setSummaryFilter('twist')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${state.summaryFilter === 'twist' ? 'bg-rose-500/60 text-white' : 'text-rose-200/60'}">Twists</button>
              </div>
            </div>

            <div class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
              ${filteredQuestions.map(item => `
                <div class="p-3.5 rounded-2xl bg-white/[0.03] border ${item.matched ? 'border-amber-400/30' : 'border-white/10'}">
                  <div class="flex items-center justify-between text-[11px] mb-1">
                    <span class="font-bold text-rose-300">Q${item.id} • Level ${item.level}</span>
                    <span class="font-bold ${item.matched ? 'text-amber-300' : 'text-rose-200/60'}">
                      ${item.matched ? '❤️‍🔥 Match' : '👀 Twist'}
                    </span>
                  </div>
                  <p class="text-xs font-semibold text-white mb-2.5">${escapeHtml(item.q)}</p>
                  <div class="space-y-1.5 text-[11px]">
                    <div class="flex items-start gap-2 text-rose-200">
                      <span class="font-bold shrink-0 text-rose-400">${escapeHtml(p1Name)}:</span>
                      <span>${item.p1 !== '-' ? `<strong>${item.p1})</strong> ${escapeHtml(item.options[item.p1])}` : 'Not answered'}</span>
                    </div>
                    <div class="flex items-start gap-2 text-amber-200">
                      <span class="font-bold shrink-0 text-amber-400">${escapeHtml(p2Name)}:</span>
                      <span>${item.p2 !== '-' ? `<strong>${item.p2})</strong> ${escapeHtml(item.options[item.p2])}` : 'Not answered'}</span>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 9. MAIN RENDER LOOP & BOOTSTRAP
    // ==========================================
    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.screen === 'home') {
        root.innerHTML = renderHomeScreen();
      } else if (state.screen === 'lobby') {
        root.innerHTML = renderLobbyScreen();
      } else if (state.screen === 'game') {
        root.innerHTML = renderGameScreen();
      } else if (state.screen === 'summary') {
        root.innerHTML = renderSummaryScreen();
      }
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      render();
      initFirebase();
    });
  </script>
</body>
</html>
